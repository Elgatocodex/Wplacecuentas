name: Compilar APK debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 (sin wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Resumen del error (si falla)
        if: failure()
        run: |
          {
            echo '## Causa del fallo'
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Could not (resolve|find|download)|> .*(not found|failed|requires)|Execution failed|Caused by" build.log | head -40
            echo '```'
            echo
            echo '### Bloque "What went wrong"'
            echo '```'
            grep -A 15 "What went wrong" build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WplaceCuentas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
