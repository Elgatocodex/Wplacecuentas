name: Compilar APK debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Localizar el proyecto Gradle
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "No se encontró settings.gradle.kts en el repositorio. Archivos:"
            find . -maxdepth 3 -not -path '*/.git/*' | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Proyecto en: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 (sin wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Resumen del error (si falla)
        if: failure()
        run: |
          {
            echo '## Causa del fallo'
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Could not (resolve|find|download)|Execution failed|Caused by" build.log | head -40
            echo '```'
            echo
            echo '### Bloque "What went wrong"'
            echo '```'
            grep -A 15 "What went wrong" build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WplaceCuentas-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
